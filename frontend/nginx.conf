server {
    # Very heavily inspired by a prod nginx config from work

    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Performance -> faster static file delivrry
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/woff2 image/svg+xml;

    # Proxy /api to backend container
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # SSE support (auction price stream, live bids)
        proxy_set_header Cache-Control no-cache;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # React router
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers -> stops clickjacking
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }
}

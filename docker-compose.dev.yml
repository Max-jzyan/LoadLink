# Dev compose —> mounts source code as volumes for hot reload
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# Frontend: http://localhost:5173 (Vite HMR)
# Backend:  http://localhost:5000 (ts-node-dev hot reload)
# MongoDB:  localhost:27017

services:
    frontend:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - ./frontend:/app
            - /app/node_modules # keep container's node_modules separate from host
        ports:
            - '5173:5173'
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
        environment:
            - NODE_ENV=development
            - VITE_API_PROXY_TARGET=http://backend:5000
        depends_on:
            - backend

    backend:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - ./backend:/app
            - /app/node_modules
        ports:
            - '5001:5000'
        command: sh -c "npm install && npm run seed && npm run dev"
        env_file:
            - .env
        environment:
            - MONGODB_URI=mongodb://mongo:27017/loadlink # override to use Docker service name
        depends_on:
            mongo:
                condition: service_healthy

    mongo:
        image: mongo:7
        ports:
            - '27018:27017'
        volumes:
            - mongo-dev-data:/data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    mongo-dev-data:
